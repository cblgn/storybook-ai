name: SonarQube Cloud

# Main-only analysis: do not require this check for pull requests on the Free plan.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-main
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube Cloud analysis
    # Enable only after SONAR_TOKEN is configured and automatic analysis is disabled.
    if: github.ref == 'refs/heads/main' && vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --no-build --project backend
      - name: Backend coverage with paths relative to the repository root
        run: uv run --no-sync --no-build --project backend pytest -c backend/pyproject.toml backend/tests --cov-config=backend/pyproject.toml --cov=backend/src/storybook --cov-report=term-missing --cov-report=xml:backend/coverage.xml
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test:coverage
        working-directory: frontend
      - name: Analyze sources and coverage
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
