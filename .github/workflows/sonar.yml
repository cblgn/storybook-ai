name: SonarQube Cloud

# Main-only analysis: do not require this check for pull requests on the Free plan.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-main
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube Cloud analysis
    # The first step verifies/disables automatic analysis before any CI scan.
    if: github.ref == 'refs/heads/main' && vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce CI-only analysis
        run: python3 scripts/sonar_analysis_mode.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14'
      - run: uv sync --locked --no-build --project backend
      - name: Backend coverage with paths relative to the repository root
        run: uv run --no-sync --no-build --project backend pytest -c backend/pyproject.toml backend/tests --cov-config=backend/pyproject.toml --cov=backend/src/storybook --cov-report=term-missing --cov-report=xml:backend/coverage.xml
      - name: Security scripts coverage
        run: |
          uv run --no-sync --no-build --project backend coverage run --rcfile=backend/pyproject.toml --source=scripts --omit='scripts/test_*.py' -m unittest discover -s scripts -p 'test_*.py'
          uv run --no-sync --no-build --project backend coverage xml --rcfile=backend/pyproject.toml -o scripts/coverage.xml
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test:coverage
        working-directory: frontend
      - name: Verify all coverage reports exist
        run: test -s backend/coverage.xml && test -s frontend/coverage/lcov.info && test -s scripts/coverage.xml
      - name: Analyze sources and coverage
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          skipSignatureVerification: false
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
