# Existing public project; authentication is supplied only through Actions secrets.
sonar.organization=cblgn
sonar.projectKey=cblgn_storybook-ai
sonar.projectName=Storybook AI
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src,.github/workflows,scripts
sonar.tests=backend/tests,frontend/tests,frontend/src,scripts
sonar.test.inclusions=backend/tests/**,frontend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,scripts/test_*.py
sonar.exclusions=**/.venv/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/htmlcov/**,**/*cache*/**,**/.scannerwork/**,**/test-results/**,**/playwright-report/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
