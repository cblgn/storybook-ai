# Replace these public identifiers after importing the repository into SonarQube Cloud.
sonar.organization=YOUR_SONAR_ORGANIZATION
sonar.projectKey=YOUR_SONAR_PROJECT_KEY
sonar.projectName=Storybook AI
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.exclusions=**/.venv/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/htmlcov/**,**/*cache*/**,**/.scannerwork/**,**/test-results/**,**/playwright-report/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
